<!doctype html><html><head><meta charset="utf-8"><title>assets test</title>
<script type="importmap">{ "imports": { "three": "../vendor/three/three.module.js", "three/addons/": "../vendor/three/addons/" } }</script>
<script>window.__ready = false;</script></head><body style="margin:0"><canvas id="c" style="width:100%;height:100%;display:block"></canvas>
<script type="module">
import * as THREE from 'three';
import { texSet, loadHDRI, ASSET_IDS } from '../src/assets.js';
const r = new THREE.WebGLRenderer({ canvas: document.getElementById('c'), antialias: true });
r.setSize(innerWidth, innerHeight, false); r.toneMapping = THREE.ACESFilmicToneMapping;
const s = new THREE.Scene(); const cam = new THREE.PerspectiveCamera(50, innerWidth / innerHeight, 0.1, 100); cam.position.set(0, 0, 9);
const ids = Object.keys(ASSET_IDS); const geo = new THREE.SphereGeometry(0.42, 48, 32);
ids.forEach((id, i) => { const t = texSet(id, { repeat: 2 }); const m = new THREE.MeshStandardMaterial({ ...Object.fromEntries(Object.entries(t).filter(([k, v]) => v)) }); const me = new THREE.Mesh(geo, m); me.position.set((i % 6) - 2.5, 1.5 - Math.floor(i / 6), 0); s.add(me); });
s.add(new THREE.DirectionalLight(0xffffff, 2).translateX(3).translateY(4).translateZ(5));
const hdr = await loadHDRI(); const pm = new THREE.PMREMGenerator(r); s.environment = pm.fromEquirectangular(hdr).texture; s.background = hdr;
await new Promise((res) => setTimeout(res, 3000));
r.render(s, cam); window.__ready = true;
</script></body></html>
